[package]
name = "waybar-editor"
version = "0.1.0"
edition = "2024"
description = "Editor nativo de Waybar con presets y respaldos"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
