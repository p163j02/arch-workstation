# wallpaper-studio:begin
$ws_wallpaper = @HOME@/wallpapers/20458297.gif
$ws_accent = rgba(4c79d4ee)
$ws_secondary = rgba(cf4988ee)
$ws_background = rgba(0b0a18ee)
$ws_text = rgba(ecebf4ff)
# wallpaper-studio:end

general {
    hide_cursor = true
}

background {
    monitor =
    path = $ws_wallpaper
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_size='200pt'>$(date +%H)</span>"
    color = $ws_accent
    font_size = 120
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_size='200pt'>$(date +%M)</span>"
    color = $ws_secondary
    font_size = 120
    font_family = JetBrains Mono
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $ws_text
    font_size = 18
    font_family = JetBrains Mono
    position = 60, 50
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = $ws_accent
    inner_color = $ws_background
    font_color = $ws_text
    fade_on_empty = true
   # placeholder_text = <i>Contraseña...</i>
    check_color = $ws_secondary
    fail_color = rgba(247, 118, 142, 1.0)
    fail_text = <i>Incorrecto</i>
    position = 0, -260
    halign = center
    valign = center
}
