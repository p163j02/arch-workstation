general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/wallpapers/dmc-9.png
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_size='200pt'>$(date +%H)</span>"
    color = rgba(168, 85, 247, 0.9)
    font_size = 120
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_size='200pt'>$(date +%M)</span>"
    color = rgba(240, 230, 255, 0.9)
    font_size = 120
    font_family = JetBrains Mono
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(240, 230, 255, 0.6)
    font_size = 18
    font_family = JetBrains Mono
    position = 60, 50
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = rgba(124, 58, 237, 0.8)
    inner_color = rgba(13, 10, 26, 0.8)
    font_color = rgba(240, 230, 255, 1.0)
    fade_on_empty = true
   # placeholder_text = <i>Contraseña...</i>
    check_color = rgba(168, 85, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    fail_text = <i>Incorrecto</i>
    position = 0, -260
    halign = center
    valign = center
}
