color14 #4a9dbd

# Blanco
color7  #8899aa
color15 #ccd6e0

# Tabs
active_tab_background   #2e6da4
active_tab_foreground   #050816
inactive_tab_background #0d1117
inactive_tab_foreground #4a8db7

# Bell
enable_audio_bell no
visual_bell_duration 0.05

shell_integration enabled
