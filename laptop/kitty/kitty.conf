# Colores base
foreground #a9c9e8
background #050816
selection_foreground #050816
selection_background #4a8db7
cursor #4a8db7

# Negro
color0  #0d1117
color8  #1c2333

# Rojo
color1  #e06c75
color9  #e88a93

# Verde
color2  #4d9a7a
color10 #6ab394

# Amarillo
color3  #c9a84c
color11 #d4b86a

# Azul (más profundo, menos cyan)
